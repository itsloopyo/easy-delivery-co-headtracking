[workspace]
name = "easy-delivery-co-head-tracking"
version = "1.0.0"
description = "Head tracking mod for Easy Delivery Co using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
# Manual: refresh vendored BepInEx from upstream within pinned range. Dev runs
# this when bumping the bundled version, then commits. CI never refreshes.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
# BepInEx.dll and 0Harmony.dll out of the committed vendor zip.
setup-loader = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
# Unity reference stubs, compiled from the shared sources in the core submodule so
# every mod builds against one copy of them. Runs after setup-loader, which clears
# libs/ before repopulating it.
setup = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 -OutputPath src/EasyDeliveryCoHeadTracking/libs -TargetFramework net48", depends-on = ["setup-loader"] }
restore = { cmd = "dotnet restore src/EasyDeliveryCoHeadTracking/EasyDeliveryCoHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/EasyDeliveryCoHeadTracking/EasyDeliveryCoHeadTracking.csproj -c Release", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId easy-delivery-co -BuildDir src/EasyDeliveryCoHeadTracking/bin/Release", depends-on = ["build"] }
# The config tests, among them the differential test in tests/config_differential, which holds
# the legacy import to the v0.2.0 reader it replaces on every published build's first-run file
# and on core's mutation corpus.
test = { cmd = "dotnet test tests/EasyDeliveryCoHeadTracking.Tests/EasyDeliveryCoHeadTracking.Tests.csproj -c Release", depends-on = ["build"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts\\uninstall.cmd"
clean = "dotnet clean src/EasyDeliveryCoHeadTracking/EasyDeliveryCoHeadTracking.csproj"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
